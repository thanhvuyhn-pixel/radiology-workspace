<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phân ca - Radiology Workspace</title>
    <style>
      :root {
        color-scheme: light dark;
        --text: #0f172a;
        --muted: #64748b;
        --panel: rgba(255, 255, 255, 0.78);
        --line: rgba(15, 23, 42, 0.08);
        --primary: #2563eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--text);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.08), transparent), #f8fafc;
      }

      .app-shell {
        display: grid;
        gap: 22px;
        padding: 28px;
      }

      .breadcrumb {
        margin-bottom: 10px;
        color: var(--muted);
        font-size: 0.86rem;
        font-weight: 800;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 5vw, 4rem);
      }

      p {
        margin: 10px 0 0;
        color: var(--muted);
        line-height: 1.7;
      }

      .schedule {
        display: grid;
        gap: 12px;
      }

      .row {
        display: grid;
        grid-template-columns: 120px minmax(0, 1fr) 120px;
        gap: 14px;
        align-items: center;
        min-height: 76px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: var(--panel);
        box-shadow: 0 18px 46px rgba(15, 23, 42, 0.08);
      }

      .row strong {
        color: var(--primary);
      }

      .chip {
        justify-self: end;
        padding: 9px 12px;
        border-radius: 999px;
        color: var(--primary);
        background: rgba(37, 99, 235, 0.1);
        font-weight: 800;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --text: #ffffff;
          --muted: rgba(255, 255, 255, 0.78);
          --panel: rgba(15, 23, 42, 0.82);
          --line: rgba(255, 255, 255, 0.14);
        }

        body {
          background: linear-gradient(135deg, rgba(37, 99, 235, 0.2), transparent), #08111f;
        }
      }

      @media (max-width: 700px) {
        .app-shell {
          padding: 20px;
        }

        .row {
          grid-template-columns: 1fr;
        }

        .chip {
          justify-self: start;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <header>
        <div class="breadcrumb">Radiology Workspace / Điều hành / Phân ca</div>
        <h1>Phân ca</h1>
        <p>Lịch phân ca mẫu cho nhóm bác sĩ, kỹ thuật viên và điều phối vận hành.</p>
      </header>

      <section class="schedule" aria-label="Lịch phân ca mẫu">
        <article class="row"><strong>07:00</strong><span>Đọc phim sáng và bàn giao ca đêm</span><span class="chip">Morning</span></article>
        <article class="row"><strong>13:30</strong><span>Điều phối phòng chụp và ưu tiên ca cấp cứu</span><span class="chip">Afternoon</span></article>
        <article class="row"><strong>18:00</strong><span>Trực tối, rà soát danh sách chờ và kết quả tồn</span><span class="chip">Evening</span></article>
      </section>
    </main>
  </body>
</html>
